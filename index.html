<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEWAACAKE - Homemade With Love</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: #FDF6E3; }

    .hero { 
      position: relative; /* INI PENTING */
      min-height: 100vh; 
      background-color: #FDF6E3;
      background-image: url('Band.jpg'); 
      background-position: center top; 
      background-size: contain; 
      background-repeat: no-repeat;
      display: flex; 
    }

    .btn-menu {
      position: absolute; /* INI KUNCINYA */
      bottom: 25%; /* Atur naik turunnya dari sini. 25% = 25% dari bawah layar */
      left: 50%;
      transform: translateX(-50%); /* biar pas di tengah */
      
      background: #8B4513; 
      color: #fff;
      padding: 16px 40px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 18px;
      text-decoration: none;
      transition: all 0.3s ease; 
      box-shadow: 0 6px 20px rgba(139, 69, 19, 0.4);
      letter-spacing: 1px;
    }
    .btn-menu:hover {
      background: #A0522D;
      transform: translateX(-50%) translateY(-4px); /* efek naik */
      box-shadow: 0 8px 25px rgba(139, 69, 19, 0.5);
    }
  </style>
</head>
<body>
  <section class="hero" id="banner_home">
    <a href="menu.html" class="btn-menu">Let's the cake</a>
  </section>
</body>
</html>
