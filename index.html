<!DOCTYPE html>
<html lang="id">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Poppins', sans-serif; background: #FDF6E3; }
    .hero {
      height: 100vh;
      background-color: #FDF6E3;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; 
      align-items: center;
      padding-bottom: 60px; 
    }
    .btn-menu {
      padding: 12px 28px; background: #5C4A3C; color: #FDF6E3;
      text-decoration: none; border-radius: 25px; font-weight: 600; font-size: 16px;
    }
  </style>
</head>
<body>

  <section class="hero" id="banner_home">
    <a href="menu.html" class="btn-menu">Let's the cake</a>
  </section>

<script>
  window.addEventListener('load', async () => {
    const SUPABASE_URL = 'https://ybfxqkwkbzgquhdazxwn.supabase.co'
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliZnhxa3drYnpncXVoZGF6eHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Njc0OTIsImV4cCI6MjEwMzI0MzQ5Mn0.byXU-wZzhkCMaIohHd_obc5b7oWq5Vu9SkCUacEO9fE'
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    const { data, error } = await supabase.from('setting').select('value').eq('key', 'banner_home').single()
    
    if(error) {

    if(data && data.value) {
      document.getElementById('banner_home').style.backgroundImage = `url('${data.value.trim()}')`
    }
  })
</script>
</body>
