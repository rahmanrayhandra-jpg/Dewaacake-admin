<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DEWAACAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
  body{font-family:'Poppins',sans-serif;background:#FFFFF0;padding:20px;margin:0}
  h1,h2{font-family:'Playfair Display',serif;color:#3E2F2F}
 .box{background:#fff;border:2px solid #D4AF37;border-radius:12px;padding:20px;margin-bottom:20px}
  input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
  button{padding:10px 20px;background:#D4AF37;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-right:5px}
  button:hover{opacity:0.9} button:disabled{background:#ccc;cursor:not-allowed}
 .btn-hapus{background:#e74c3c}.btn-edit{background:#3498db}
  #notifProduk{margin-top:10px;font-weight:600}
 .produk-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
 .produk-card{border:1px solid #eee;padding:10px;border-radius:8px;text-align:center;background:#fff}
 .produk-card img{width:100%;height:140px;object-fit:cover;border-radius:8px;margin-bottom:8px}
 .btn-group{display:flex;gap:5px;margin-top:10px}
 .btn-group button{flex:1;padding:8px;font-size:12px}
  #previewGambar{width:100px;height:100px;object-fit:cover;border-radius:8px;margin-top:10px;border:1px solid #ddd}
</style>
</head>
<body>

<h1>Dashboard Admin DEWAACAKE</h1>

<div class="box">
  <h2 id="formTitle">Tambah Produk Baru</h2>
  <input id="idProduk" type="hidden">
  <input id="namaProduk" placeholder="Nama Produk. Contoh: Kunafa Jeruk">
  <input id="hargaProduk" placeholder="Harga. Contoh: 35000" type="number">

  <label>Upload Gambar:</label>
  <input id="uploadGambar" type="file" accept="image/*">
  <img id="previewGambar" style="display:none">
  <input id="gambarProduk" type="hidden"> <!-- buat nyimpen url hasil upload -->

  <button onclick="simpanProduk()" id="btnSimpan">+ Simpan Produk</button>
  <button onclick="batalEdit()" id="btnBatal" style="display:none;background:#95a5a6">Batal</button>
  <p id="notifProduk"></p>
</div>

<div class="box">
  <h2>Daftar Produk</h2>
  <div id="listProduk" class="produk-list">Loading...</div>
</div>

<script>
const SUPABASE_URL = 'https://ybfxqkwkbzgquhdazxwn.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliZnhxa3drYnpncXVoZGF6eHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Njc0OTIsImV4cCI6MjEwMzI0MzQ5Mn0.byXU-wZzhkCMaIohHd_obc5b7oWq5Vu9SkCUacEO9fE'
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let modeEdit = false

// 1. UPLOAD GAMBAR OTOMATIS PAS PILIH FILE
document.getElementById('uploadGambar').addEventListener('change', async (e) => {
  const file = e.target.files[0]
  if(!file) return

  document.getElementById('btnSimpan').disabled = true
  document.getElementById('notifProduk').innerText = 'Upload gambar...'
  document.getElementById('notifProduk').style.color = 'orange'

  // Tampilkan preview
  const reader = new FileReader()
  reader.onload = (e) => {
    document.getElementById('previewGambar').src = e.target.result
    document.getElementById('previewGambar').style.display = 'block'
  }
  reader.readAsDataURL(file)

  // Upload ke Storage bucket 'produk'
  const fileName = `produk-${Date.now()}-${file.name}`
  const { data, error } = await supabaseClient.storage.from('produk').upload(fileName, file)

  if(error){
    document.getElementById('notifProduk').innerText = 'Gagal upload: '+error.message
    document.getElementById('notifProduk').style.color = 'red'
  } else {
    // Ambil URL public nya
    const { data: urlData } = supabaseClient.storage.from('produk').getPublicUrl(fileName)
    document.getElementById('gambarProduk').value = urlData.publicUrl
    document.getElementById('notifProduk').innerText = 'Gambar berhasil diupload!'
    document.getElementById('notifProduk').style.color = 'green'
  }
  document.getElementById('btnSimpan').disabled = false
})

// 2. SIMPAN / UPDATE PRODUK
async function simpanProduk(){
  const id = document.getElementById('idProduk').value
  const nama = document.getElementById('namaProduk').value.trim()
  const harga = parseInt(document.getElementById('hargaProduk').value)
  const gambar = document.getElementById('gambarProduk').value
  const notif = document.getElementById('notifProduk')

  if(!nama ||!harga){ notif.innerText = 'Nama dan Harga wajib diisi!'; notif.style.color='red'; return }
  if(!gambar){ notif.innerText = 'Upload gambar dulu!'; notif.style.color='red'; return }

  let error
  if(modeEdit){
    ({ error } = await supabaseClient.from('produk').update({ nama, harga, gambar }).eq('id', id))
  } else {
    ({ error } = await supabaseClient.from('produk').insert([{ nama, harga, gambar }]))
  }

  if(error){ notif.innerText = 'Gagal: '+error.message; notif.style.color='red' }
  else {
    notif.innerText = modeEdit? 'Produk berhasil diupdate!' : 'Produk berhasil ditambah!';
    notif.style.color='green';
    batalEdit()
    loadProduk()
  }
}

// 3. LOAD PRODUK
async function loadProduk(){
  const { data } = await supabaseClient.from('produk').select('*').order('id', {ascending:false})
  let html = ''
  data.forEach(p=>{
    html += `<div class="produk-card">
      <img src="${p.gambar}">
      <h4>${p.nama}</h4>
      <p><b>Rp${p.harga.toLocaleString('id-ID')}</b></p>
      <div class="btn-group">
        <button class="btn-edit" onclick="editProduk(${p.id}, '${p.nama}', ${p.harga}, '${p.gambar}')">Edit</button>
        <button class="btn-hapus" onclick="hapusProduk(${p.id})">Hapus</button>
      </div>
    </div>`
  })
  document.getElementById('listProduk').innerHTML = html || 'Belum ada produk'
}

// 4. EDIT & HAPUS
function editProduk(id, nama, harga, gambar){
  modeEdit = true
  document.getElementById('formTitle').innerText = 'Edit Produk'
  document.getElementById('btnSimpan').innerText = 'Update Produk'
  document.getElementById('btnBatal').style.display = 'inline-block'
  document.getElementById('idProduk').value = id
  document.getElementById('namaProduk').value = nama
  document.getElementById('hargaProduk').value = harga
  document.getElementById('gambarProduk').value = gambar
  document.getElementById('previewGambar').src = gambar
  document.getElementById('previewGambar').style.display = 'block'
  window.scrollTo(0,0)
}

function batalEdit(){
  modeEdit = false
  document.getElementById('formTitle').innerText = 'Tambah Produk Baru'
  document.getElementById('btnSimpan').innerText = '+ Simpan Produk'
  document.getElementById('btnBatal').style.display = 'none'
  document.getElementById('idProduk').value = ''
  document.getElementById('namaProduk').value = ''
  document.getElementById('hargaProduk').value = ''
  document.getElementById('gambarProduk').value = ''
  document.getElementById('uploadGambar').value = ''
  document.getElementById('previewGambar').style.display = 'none'
}

async function hapusProduk(id){
  // hapus confirm dulu, langsung hapus aja
  const { error } = await supabaseClient.from('produk').delete().eq('id', id)
  
  if(error){
    alert('Gagal hapus: ' + error.message) 
    return
  }
  alert('Produk berhasil dihapus')
  loadProduk() 
}

loadProduk()
</script>
</body>
</html>
