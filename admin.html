<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<title>Admin DewaaCake</title>
<style>
  body{font-family:Poppins,sans-serif;background:#fff8f0;padding:30px; max-width:700px; margin:auto;}
  h2{color:#A67B5B; text-align:center;}
  h3{margin-top:30px; color:#3E2F2F; border-bottom:2px solid #D4AF37; padding-bottom:8px;}
  input, textarea{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box;}
.btn{background:#D4AF37; color:#fff; padding:12px 20px; border:none; border-radius:8px; font-weight:600; cursor:pointer; width:100%;}
.btn:hover{background:#c19b2e;}
  hr{margin:30px 0; border:none; border-top:1px solid #eee;}
 .warning{background:#ffebeb; border:1px solid red; padding:10px; border-radius:8px; color:red; font-size:13px; margin-bottom:20px;}
</style>
</head>
<body>

<h2>Admin DewaaCake</h2>
<div class="warning">⚠️ JANGAN SHARE FILE INI. Ini pake Service Role Key</div>

<h3>1. Tambah Produk</h3>
<input id="produk_nama" placeholder="Nama Produk">
<textarea id="produk_desk" placeholder="Deskripsi Produk"></textarea>
<input id="produk_harga" type="number" placeholder="Harga">
<input id="produk_gambar" type="file">
<button onclick="tambahProduk()" class="btn">+ Simpan Produk</button>

<hr>

<h3>2. Tambah Promo Bundling</h3>
<input id="promo_nama" placeholder="Nama Paket">
<textarea id="promo_desk" placeholder="Deskripsi Paket"></textarea>
<input id="promo_harga" type="number" placeholder="Harga">
<input id="promo_badge" placeholder="Badge: PALING LARIS / BARU">
<input id="promo_gambar" type="file">
<button onclick="tambahPromo()" class="btn">+ Simpan Promo</button>

<script>
const SUPABASE_URL = 'https://wcydigragsujlumtlxsb.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjeWRpZ3JhZ3N1amx1bXRseHNiIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NzczOTM2MiwiZXhwIjoyMTAzMzE1MzYyfQ.VFpUGeaR95HddMqZohUjYWAr25B86_5Clxw1VFXXpZ4' // <--- GANTI INI
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: false }
})

async function uploadGambar(file, folder){
  const { data, error } = await db.storage.from('gambar').upload(`${folder}/${Date.now()}_${file.name}`, file, {
    cacheControl: '3600',
    upsert: false
  })
  if(error){ alert('Upload Gagal: ' + error.message); return null }
  return SUPABASE_URL + '/storage/v1/object/public/gambar/' + data.path
}

async function tambahProduk(){
  const nama = document.getElementById('produk_nama').value;
  const desk = document.getElementById('produk_desk').value;
  const harga = parseInt(document.getElementById('produk_harga').value);
  const file = document.getElementById('produk_gambar').files[0];
  if(!nama ||!harga){ alert('Nama dan Harga wajib'); return }
  
  let gambarUrl = '';
  if(file){ gambarUrl = await uploadGambar(file, 'produk') }

  const { error } = await db.from('produk').insert([{nama, deskripsi: desk, harga, gambar: gambarUrl}])
  if(error){ alert('Gagal: ' + error.message) } else { alert('Produk berhasil disimpan!'); }
}

async function tambahPromo(){
  const nama = document.getElementById('promo_nama').value;
  const desk = document.getElementById('promo_desk').value;
  const harga = parseInt(document.getElementById('promo_harga').value);
  const badge = document.getElementById('promo_badge').value;
  const file = document.getElementById('promo_gambar').files[0];
  if(!nama ||!harga){ alert('Nama dan Harga wajib'); return }

  let gambarUrl = '';
  if(file){ gambarUrl = await uploadGambar(file, 'promo') }

  const { error } = await db.from('promo').insert([{nama, deskripsi: desk, harga, badge, gambar: gambarUrl}])
  if(error){ alert('Gagal: ' + error.message) } else { alert('Promo berhasil disimpan!'); }
}
</script>
</body>
</html>
