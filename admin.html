<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial; padding: 20px; background: #f5f5f5; }
 .card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
  input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
  button { background: #d97706; color: white; border: none; cursor: pointer; border-radius: 5px; }
  img { max-width: 200px; margin-top: 10px; border-radius: 5px; }
</style>
</head>
<body>
<h1>Admin Panel</h1>

<div class="card">
  <h2>Upload Banner Menu</h2>
  <input type="file" id="bannerInput" accept="image/*">
  <button onclick="uploadBanner()">Upload Banner</button>
  <img id="bannerPreview" src="" style="display:none">
</div>

<div class="card">
  <h2>Tambah Produk</h2>
  <input type="text" id="nama" placeholder="Nama Produk">
  <input type="text" id="harga" placeholder="Harga">
  <input type="file" id="produkImg" accept="image/*">
  <button onclick="tambahProduk()">Simpan Produk</button>
</div>

<script>
const SUPABASE_URL = "https://wcydigragsujlumtlxsb.supabase.co"
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndjeWRpZ3JhZ3N1amx1bXRseHNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzkzNjIsImV4cCI6MjEwMzMxNTM2Mn0.073ZiBOXltLikQqN7pyNBFinfkBwZTWIc5Gj7DV8Hp0"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

// TAMPILIN BANNER LAMA PAS BUKA HALAMAN
async function loadBanner() {
  const { data } = await supabase.from('setting').select('value').eq('key','banner_menu').single()
  if(data) document.getElementById('bannerPreview').src = data.value
}
loadBanner()

// UPLOAD BANNER
async function uploadBanner() {
  const file = document.getElementById('bannerInput').files[0]
  if(!file) return alert('Pilih gambar dulu')
  
  const fileName = `banner-${Date.now()}.jpg`
  const { error: upErr } = await supabase.storage.from('Asset').upload(fileName, file)
  if(upErr) return alert('Gagal upload: ' + upErr.message)
  
  const { data: { publicUrl } } = supabase.storage.from('Asset').getPublicUrl(fileName)
  
  // SIMPAN LINK KE TABEL SETTING
  const { error: dbErr } = await supabase.from('setting').upsert({ key: 'banner_menu', value: publicUrl })
  if(dbErr) return alert('Gagal simpan link: ' + dbErr.message)
  
  document.getElementById('bannerPreview').src = publicUrl
  document.getElementById('bannerPreview').style.display = 'block'
  alert('Banner berhasil diupload!')
}

// TAMBAH PRODUK
async function tambahProduk() {
  const nama = document.getElementById('nama').value
  const harga = document.getElementById('harga').value
  const file = document.getElementById('produkImg').files[0]
  if(!nama ||!harga ||!file) return alert('Lengkapi semua')
  
  const fileName = `produk-${Date.now()}.jpg`
  await supabase.storage.from('Asset').upload(fileName, file)
  const { data: { publicUrl } } = supabase.storage.from('Asset').getPublicUrl(fileName)
  
  await supabase.from('produk').insert({ nama, harga, gambar: publicUrl })
  alert('Produk berhasil ditambah!')
}
</script>
</body>
</html>
