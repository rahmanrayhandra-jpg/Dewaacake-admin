<!DOCTYPE html>
<html lang="id">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - DEWAACAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap');
  body{font-family:'Poppins',sans-serif;background:#FFFFF0;padding:20px;margin:0}
  h1,h2,h3{font-family:'Playfair Display',serif;color:#3E2F2F}
.box{background:#fff;border:2px solid #D4AF37;border-radius:12px;padding:20px;margin-bottom:20px}
  input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
  button{padding:10px 20px;background:#D4AF37;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin:5px}
.btn-hapus{background:#e74c3c}.btn-edit{background:#3498db}
.produk-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.produk-card{border:1px solid #eee;padding:10px;border-radius:8px;text-align:center;background:#fff}
.produk-card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.btn-group{display:flex;gap:5px;margin-top:10px}
.btn-group button{flex:1;padding:8px;font-size:12px}
  #previewGambar{width:100px;height:100px;object-fit:cover;border-radius:8px;margin-top:10px}
</style>
</head>
<body>

<h1>Dashboard Admin DEWAACAKE</h1>

<div class="box">
  <h2 id="formTitle">Tambah Produk Baru</h2>
  <input id="idProduk" type="hidden">
  <input id="namaProduk" placeholder="Nama Produk">
  <input id="hargaProduk" placeholder="Harga" type="number">
  <label>Upload Gambar:</label>
  <input id="uploadGambar" type="file" accept="image/*">
  <img id="previewGambar" style="display:none">
  <input id="gambarProduk" type="hidden">
  <button onclick="simpanProduk()" id="btnSimpan">+ Simpan Produk</button>
  <button onclick="batalEdit()" id="btnBatal" style="display:none;background:#95a5a6">Batal</button>
</div>

<div class="box">
  <h2>Daftar Produk</h2>
  <div id="listProduk" class="produk-list">Loading...</div>
</div>

<script>
const SUPABASE_URL = 'https://ybfxqkwkbzgquhdazxwn.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InliZnhxa3drYnpncXVoZGF6eHduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2Njc0OTIsImV4cCI6MjEwMzI0MzQ5Mn0.byXU-wZzhkCMaIohHd_obc5b7oWq5Vu9SkCUacEO9fE'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let modeEdit = false
let produkEdit = {}

document.getElementById('uploadGambar').addEventListener('change', async (e) => {
  const file = e.target.files[0]
  if(!file) return
  const fileName = `produk-${Date.now()}-${file.name}`
  const { error } = await supabase.storage.from('produk').upload(fileName, file)
  if(!error){
    const { data: urlData } = supabase.storage.from('produk').getPublicUrl(fileName)
    document.getElementById('gambarProduk').value = urlData.publicUrl
    document.getElementById('previewGambar').src = urlData.publicUrl
    document.getElementById('previewGambar').style.display = 'block'
  } else { alert('Upload gagal: ' + error.message) }
})

async function simpanProduk(){
  const id = document.getElementById('idProduk').value
  const nama = document.getElementById('namaProduk').value.trim()
  const harga = parseInt(document.getElementById('hargaProduk').value)
  const gambar = document.getElementById('gambarProduk').value
  if(!nama ||!harga ||!gambar){ alert('Lengkapi semua data!'); return }
  
  document.getElementById('btnSimpan').innerText = 'Menyimpan...'
  document.getElementById('btnSimpan').disabled = true

  if(modeEdit){ 
    await supabase.from('produk').update({ nama, harga, gambar }).eq('id', id) 
  } else { 
    await supabase.from('produk').insert([{ nama, harga, gambar }]) 
  }
  alert('Berhasil')
  batalEdit()
  loadProduk()

  document.getElementById('btnSimpan').innerText = modeEdit? 'Update Produk' : '+ Simpan Produk'
  document.getElementById('btnSimpan').disabled = false
}

async function loadProduk(){
  const { data, error } = await supabase.from('produk').select('*').order('id', {ascending:false})
  if(error){ document.getElementById('listProduk').innerHTML = 'Error: ' + error.message; return }
  let html = ''
  data.forEach(p=>{
    produkEdit[p.id] = p
    html += `<div class="produk-card">
      <img src="${p.gambar}">
      <h4>${p.nama}</h4>
      <p><b>Rp${p.harga.toLocaleString('id-ID')}</b></p>
      <div class="btn-group">
        <button class="btn-edit" onclick="editProduk(${p.id})">Edit</button>
        <button class="btn-hapus" onclick="hapusProduk(${p.id})">Hapus</button>
      </div>
    </div>`
  })
  document.getElementById('listProduk').innerHTML = html || 'Belum ada produk'
}

function editProduk(id){ 
  const p = produkEdit[id]
  modeEdit = true; 
  document.getElementById('formTitle').innerText = 'Edit Produk'; 
  document.getElementById('btnSimpan').innerText = 'Update Produk'; 
  document.getElementById('btnBatal').style.display = 'inline-block'; 
  document.getElementById('idProduk').value = p.id; 
  document.getElementById('namaProduk').value = p.nama; 
  document.getElementById('hargaProduk').value = p.harga; 
  document.getElementById('gambarProduk').value = p.gambar; 
  document.getElementById('previewGambar').src = p.gambar; 
  document.getElementById('previewGambar').style.display = 'block'; 
  window.scrollTo(0,0) 
}
function batalEdit(){ 
  modeEdit = false; 
  document.getElementById('formTitle').innerText = 'Tambah Produk Baru'; 
  document.getElementById('btnSimpan').innerText = '+ Simpan Produk'; 
  document.getElementById('btnBatal').style.display = 'none'; 
  document.getElementById('idProduk').value = ''; 
  document.getElementById('namaProduk').value = ''; 
  document.getElementById('hargaProduk').value = ''; 
  document.getElementById('gambarProduk').value = ''; 
  document.getElementById('uploadGambar').value = ''; 
  document.getElementById('previewGambar').style.display = 'none' 
}
async function hapusProduk(id){
  if(!confirm('Yakin mau hapus produk ini?')) return
  await supabase.from('produk').delete().eq('id', id)
  alert('Produk dihapus'); loadProduk()
}

loadProduk()
</script>
</body>
</html>
